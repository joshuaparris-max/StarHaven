<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarHaven — A Tiny Space Adventure</title>
<style>
  :root { --bg:#05060f; --card:#0d1124; --line:#1d2748; --text:#dfe6ff; --muted:#8a93c4; --accent:#5fd0ff; --gold:#ffd166; --bad:#ff7a8a; --good:#6ee7a8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Courier New',monospace; background:radial-gradient(circle at 50% -10%,#101842,#05060f); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:20px; }
  .game { max-width:720px; width:100%; }
  h1 { text-align:center; font-size:2rem; letter-spacing:.18em; color:var(--accent); text-shadow:0 0 16px #2a6cff; margin-bottom:2px; }
  .sub { text-align:center; color:var(--muted); font-size:.72rem; letter-spacing:.3em; margin-bottom:16px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:.8rem; margin-bottom:14px; }
  .stat { display:flex; flex-direction:column; }
  .stat .l { color:var(--muted); font-size:.66rem; letter-spacing:.1em; }
  .stat .v { color:var(--accent); font-weight:bold; }
  .story { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; line-height:1.7; white-space:pre-wrap; min-height:160px; }
  .gold{color:var(--gold)} .bad{color:var(--bad)} .good{color:var(--good)}
  .choices { display:flex; flex-direction:column; gap:9px; margin-top:14px; }
  .btn { background:#0d1124; border:1px solid var(--accent); color:var(--accent); text-align:left; padding:12px 16px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:.92rem; transition:.15s; }
  .btn:hover { background:var(--accent); color:#04121e; }
  .btn.alt { border-color:var(--line); color:var(--text); }
  .log { color:var(--muted); font-size:.74rem; margin-top:10px; min-height:18px; text-align:center; }
  .name-in { width:100%; background:#0d1124; border:1px solid var(--line); color:var(--text); padding:10px; border-radius:8px; font-family:inherit; margin-top:10px; }
  .saved-note { text-align:center; font-size:.72rem; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<div class="game">
  <h1>★ STARHAVEN ★</h1>
  <div class="sub">A TINY SPACE ADVENTURE · DRIFT FRONTIER</div>
  <div class="stats" id="stats"></div>
  <div class="story" id="story"></div>
  <div class="choices" id="choices"></div>
  <div class="log" id="log"></div>
  <div class="saved-note" id="savenote"></div>
</div>
<script>
const SKEY='starhaven_save_v1';
const $=id=>document.getElementById(id);
let S = { hp:100, credits:300, rep:0, ship:100, name:'Pilot', node:'start', endings:load('starhaven_endings',[]) };

function load(k,d){ try{ return JSON.parse(localStorage.getItem(k))??d; }catch(e){ return d; } }
function saveGame(){ localStorage.setItem(SKEY, JSON.stringify(S)); }
function clearGame(){ localStorage.removeItem(SKEY); }

function stats(){
  const repWord = S.rep>=3?'<span class="good">Trusted</span>':S.rep<=-3?'<span class="bad">Outlaw</span>':'Neutral';
  $('stats').innerHTML=`
   <div class="stat"><span class="l">PILOT</span><span class="v">${esc(S.name)}</span></div>
   <div class="stat"><span class="l">HEALTH</span><span class="v">${Math.max(0,S.hp)}</span></div>
   <div class="stat"><span class="l">CREDITS</span><span class="v">${S.credits}</span></div>
   <div class="stat"><span class="l">SHIP</span><span class="v">${Math.max(0,S.ship)}%</span></div>
   <div class="stat"><span class="l">REPUTATION</span><span class="v">${repWord}</span></div>`;
}
function log(m){ $('log').textContent=m?'» '+m:''; }
function go(id){ S.node=id; saveGame(); render(); }

const N = {
  start:{ text:`Your patched-up courier ship, the <span class="gold">Lark</span>, drifts into the shadow of StarHaven — a frontier station bolted together from salvage and stubbornness, perched on the edge of charted space.

A message blinks on your console from Dispatch:

"Welcome back, pilot. Three jobs on the board, and the Concord patrols are tightening. Pick one. Try to come back in one piece — and so should the ship."

What do they call you out here?`,
    input:true,
    choices:[{t:'Set out →', f:v=>{ if(v) S.name=v; }, n:'board'}] },

  board:{ text:`Three contracts glow on the board:

<span class="gold">RESCUE</span> — A miner's pod is adrift near a collapsing gas giant. Salvage crews won't risk it. The family will pay what little they have.

<span class="gold">INTERCEPT</span> — A smuggler is running stolen med-supplies meant for the outer colonies. Dispatch wants them recovered — quietly.

<span class="gold">SIGNAL</span> — An old distress beacon has woken up inside the dead Vael ruins on a nearby moon. Nobody knows who, or what, is calling.`,
    choices:[
      {t:'[RESCUE] Brave the gas giant.', n:'r1'},
      {t:'[INTERCEPT] Chase the smuggler.', n:'i1'},
      {t:'[SIGNAL] Investigate the ruins.', n:'s1'},
    ]},

  // RESCUE
  r1:{ text:`The gas giant churns like a bruise. The miner's pod tumbles in the upper storms, hull lights flickering. Your sensors scream about turbulence.

You can dive hard and fast through the storm — risky for the ship — or take the long, careful spiral that burns time the pod may not have.`,
    choices:[
      {t:'Dive hard and fast.', f:()=>{S.ship-=30; log('The storm batters the hull. Ship -30%');}, n:'r2'},
      {t:'Spiral in carefully.', f:()=>{S.hp-=10; log('Tense hours at the controls. Health -10');}, n:'r2'},
    ]},
  r2:{ text:`You match the pod's spin and clamp on. Inside: a frightened mechanic and her young son, air running thin.

"Our credits are yours," she gasps. "All of it. Just get us out."

The storm is closing. You could take their pay in full — or wave it off and just fly.`,
    choices:[
      {t:'Take the pay. You earned it.', f:()=>{S.credits+=150; S.rep-=1;}, n:'r3'},
      {t:'Wave it off. Just fly.', f:()=>{S.rep+=3; log('Word of this will travel.');}, n:'r3'},
    ]},
  r3:{ text:`You break atmosphere as the giant swallows the storm behind you. The boy presses his hand to the glass and grins at the stars.

Dispatch pings: "Clean save, pilot. That's the kind of run that builds a name."`,
    choices:[{t:'Return to StarHaven', n:'end_rescue'}]},
  end_rescue:{ end:true, title:'THE LIFELINE', tone:'good',
    text:`You bring the family home to StarHaven's docks. Whatever you charged, you flew into a dying world to pull strangers out of it — and that story outlives any payday.

<span class="good">Some pilots haul cargo. You hauled hope.</span>` },

  // INTERCEPT
  i1:{ text:`You find the smuggler's ship, the <span class="gold">Quill</span>, running dark along an asteroid lane. Hailing them gets only static, then a tired voice:

"Whatever they're paying you, it's less than these meds are worth to the colonies. Concord was going to seize them and sell them back. I'm just... moving them faster."`,
    choices:[
      {t:'Order them to stand down.', n:'i2a'},
      {t:'Hear them out.', f:()=>{S.rep+=1;}, n:'i2b'},
    ]},
  i2a:{ text:`You lock weapons. The Quill bolts. A short, ugly chase through the asteroids — your hull scrapes rock, their engine flares and dies.

You recover the crates intact. Dispatch is pleased. The smuggler, cuffed in your hold, says nothing the whole way back.`,
    choices:[
      {t:'Hand them to the Concord.', f:()=>{S.credits+=200; S.rep-=2; S.ship-=15;}, n:'end_lawful'},
      {t:'Quietly let the meds reach the colony first.', f:()=>{S.rep+=2; S.ship-=15;}, n:'end_smuggler'},
    ]},
  i2b:{ text:`You drop your weapons lock. The smuggler exhales.

"The Greywater colony has sick kids and no leverage. Help me get these there, and I'll give you the manifest — proof of what Concord was doing. Your call, pilot."`,
    choices:[
      {t:'Escort the meds to Greywater.', f:()=>{S.rep+=3; S.credits-=20;}, n:'end_smuggler'},
      {t:'Take the manifest, take the meds, hand both to Dispatch.', f:()=>{S.credits+=200; S.rep-=1;}, n:'end_lawful'},
    ]},
  end_smuggler:{ end:true, title:'THE QUIET GOOD', tone:'good',
    text:`The med-crates reach Greywater. Children who would have gone without get their chance. Concord files a complaint they can't prove, and the colonies remember the pilot who looked the other way for the right reason.

<span class="good">Not every rule is justice. You learned to tell the difference.</span>` },
  end_lawful:{ end:true, title:'THE LETTER OF THE LAW', tone:'',
    text:`You deliver the cargo and the smuggler to the Concord, exactly as ordered. The credits are real. So is the weight in your chest as the cell door closes.

<span class="muted">You did the job. You'll spend a while wondering if the job was right.</span>` },

  // SIGNAL
  s1:{ text:`The Vael ruins sprawl across the dead moon — black geometric towers older than any human map. The beacon pulses from deep inside, a heartbeat in a corpse.

You can power up and walk in lit, announcing yourself — or kill your lights and move quiet through the dark halls.`,
    choices:[
      {t:'Walk in lit. Nothing to hide.', f:()=>{S.rep+=1;}, n:'s2'},
      {t:'Go dark and quiet.', f:()=>{S.hp-=5; log('You move blind through cold halls. Health -5');}, n:'s2'},
    ]},
  s2:{ text:`At the heart of the ruins: not a person, but a <span class="gold">caretaker</span> — a Vael machine, ancient and patient, kept alive by a single failing power cell. It has been broadcasting for ten thousand years, asking one question in a dead language your translator finally cracks:

"Is anyone still out there?"

It offers you a choice: take its power cell — a relic worth a fortune — and let it finally sleep. Or share your own ship's spare cell, and let it keep watching the stars.`,
    choices:[
      {t:'Take the relic. Let it rest.', f:()=>{S.credits+=350; S.ship-=20;}, n:'end_relic'},
      {t:'Give it your spare cell.', f:()=>{S.rep+=3; S.ship-=10;}, n:'end_caretaker'},
    ]},
  end_relic:{ end:true, title:'THE LAST BREATH', tone:'gold',
    text:`The caretaker's lights dim, almost gratefully, as you lift the cell free. Ten thousand years of waiting, ended by a stranger's hand. The relic will make you rich.

<span class="gold">You'll hear that question in quiet moments for the rest of your life: "Is anyone still out there?"</span>` },
  end_caretaker:{ end:true, title:'THE KEPT WATCH', tone:'good',
    text:`Your spare cell clicks home. The caretaker brightens, and for the first time in an age its question becomes a statement:

"Someone is still out there."

You leave it watching the stars, a little poorer, strangely lighter. Some debts aren't measured in credits.` },
};

function render(){
  stats();
  const node = N[S.node];
  $('savenote').textContent = `Endings discovered: ${S.endings.length} / 6 · progress auto-saves`;
  if(node.end){
    if(!S.endings.includes(S.node)){ S.endings.push(S.node); localStorage.setItem('starhaven_endings',JSON.stringify(S.endings)); }
    clearGame();
    $('story').innerHTML = `<span class="${node.tone||'gold'}">══ ENDING: ${node.title} ══</span>\n\n${node.text}\n\n<span class="muted">Final — Health ${Math.max(0,S.hp)} · Credits ${S.credits} · Ship ${Math.max(0,S.ship)}%</span>`;
    $('choices').innerHTML='';
    addBtn('↻ Play again', ()=>{ S={hp:100,credits:300,rep:0,ship:100,name:S.name,node:'start',endings:S.endings}; go('start'); }, 'alt');
    log('');
    return;
  }
  $('story').innerHTML = node.text;
  $('choices').innerHTML='';
  if(node.input){
    const inp=document.createElement('input'); inp.className='name-in'; inp.placeholder='Enter a callsign…'; inp.maxLength=18; $('choices').appendChild(inp);
    node.choices.forEach(c=>addBtn(c.t, ()=>{ if(c.f)c.f(inp.value.trim()); go(c.n); }));
  } else {
    node.choices.forEach(c=>addBtn(c.t, ()=>{ if(c.f)c.f(); if(S.hp<=0){ return go('end_lost'); } go(c.n); }));
  }
  if(S.node!=='start'){ addBtn('⟲ Restart adventure', ()=>{ clearGame(); S={hp:100,credits:300,rep:0,ship:100,name:S.name,node:'start',endings:S.endings}; go('start'); }, 'alt'); }
}
N.end_lost={ end:true, title:'LOST TO THE DRIFT', tone:'bad', text:`Your systems fail in the cold between stars. The Lark goes silent. Out here, the dark keeps what it takes.` };

function addBtn(t,fn,cls){ const b=document.createElement('button'); b.className='btn'+(cls?' '+cls:''); b.innerHTML=t; b.onclick=fn; $('choices').appendChild(b); }
function esc(s){ return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

// resume saved game if present
const saved=load(SKEY,null);
if(saved){ S=Object.assign(S,saved); S.endings=load('starhaven_endings',[]); }
render();
</script>
</body>
</html>
